<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UniDown — Video Downloader</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:       #080b10;
      --surface:  #0f1318;
      --border:   #1e2530;
      --accent:   #ff4655;
      --accent2:  #ff8c42;
      --text:     #e8eaf0;
      --muted:    #6b7380;
      --radius:   12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }

    header { text-align: center; margin-bottom: 3rem; }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 1rem;
    }

    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.6rem;
      font-weight: 800;
      background: linear-gradient(120deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }

    .tagline { color: var(--muted); font-size: .95rem; margin-top: .4rem; }

    .supported {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .chip {
      padding: .2rem .65rem;
      border-radius: 100px;
      border: 1px solid var(--border);
      font-size: .75rem;
      color: var(--muted);
      background: var(--surface);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .input-row { display: flex; gap: .6rem; }

    input[type="url"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .75rem 1rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }

    input[type="url"]:focus { border-color: var(--accent); }
    input[type="url"]::placeholder { color: var(--muted); }

    .btn {
      padding: .75rem 1.4rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      font-weight: 500;
      transition: all .15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #c0392b);
      color: #fff;
    }

    .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; filter: none; }

    .error-box {
      background: rgba(255,70,85,.08);
      border: 1px solid rgba(255,70,85,.3);
      border-radius: 8px;
      padding: .75rem 1rem;
      color: #ff8a94;
      font-size: .9rem;
      margin-top: 1rem;
      display: none;
    }

    #result { display: none; }

    .meta {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }

    .meta img {
      width: 150px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .meta-info h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: .35rem;
    }

    .meta-sub {
      color: var(--muted);
      font-size: .85rem;
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
    }

    .player-wrap {
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }

    .formats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media(max-width: 520px) { .formats-grid { grid-template-columns: 1fr; } }

    .format-section h3 {
      font-family: 'Syne', sans-serif;
      font-size: .85rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: .65rem;
    }

    .format-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: .6rem .9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .875rem;
      cursor: pointer;
      margin-bottom: .4rem;
      transition: all .15s;
      text-decoration: none;
      text-align: left;
    }

    .format-btn:hover { border-color: var(--accent); background: rgba(255,70,85,.04); }
    .format-btn.active { border-color: var(--accent); background: rgba(255,70,85,.08); }

    .format-badge {
      font-size: .72rem;
      padding: .15rem .45rem;
      border-radius: 4px;
      background: rgba(255,140,66,.15);
      color: var(--accent2);
      text-decoration: none;
      white-space: nowrap;
    }

    .format-badge:hover { background: rgba(255,140,66,.3); }

    .format-right {
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .format-size { font-size: .75rem; color: var(--muted); }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: .4rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .plyr { --plyr-color-main: var(--accent); }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <div class="logo-icon">🎬</div>
      <h1>UniDown</h1>
    </div>
    <p class="tagline">Stream & download videos from anywhere</p>
    <div class="supported">
      <span class="chip">YouTube</span>
      <span class="chip">Twitter / X</span>
      <span class="chip">Vimeo</span>
      <span class="chip">TikTok</span>
      <span class="chip">Instagram</span>
      <span class="chip">Reddit</span>
      <span class="chip">1000+ sites</span>
    </div>
  </header>

  <div class="card">
    <div class="input-row">
      <input type="url" id="urlInput" placeholder="Paste a video URL…" autocomplete="off" spellcheck="false"/>
      <button class="btn btn-primary" id="fetchBtn" onclick="fetchVideo()">Analyze</button>
    </div>
    <div class="error-box" id="errorBox"></div>
  </div>

  <div id="result">
    <div class="card">
      <div class="meta">
        <img id="thumb" src="" alt="thumbnail"/>
        <div class="meta-info">
          <h2 id="title"></h2>
          <div class="meta-sub">
            <span id="uploader"></span>
            <span id="duration"></span>
          </div>
        </div>
      </div>

      <div class="player-wrap">
        <video id="player" playsinline controls></video>
      </div>

      <div class="formats-grid">
        <div class="format-section">
          <h3>📹 Video (MP4)</h3>
          <div id="videoFormats"></div>
        </div>
        <div class="format-section">
          <h3>🎵 Audio only</h3>
          <div id="audioFormats"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script>
  // ============================================================
  // 🔧 Your Hugging Face backend URL
  const BACKEND = 'https://mythicxs-unidown-backend.hf.space';
  // ============================================================

  let plyrPlayer = null;

  document.getElementById('urlInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') fetchVideo();
  });

  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = '⚠️ ' + msg;
    box.style.display = 'block';
  }

  function hideError() {
    document.getElementById('errorBox').style.display = 'none';
  }

  function formatDuration(seconds) {
    if (!seconds) return '';
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}m ${s}s`;
  }

  function formatSize(bytes) {
    if (!bytes) return '';
    return (bytes / 1e6).toFixed(0) + ' MB';
  }

  function setStream(url, activeBtn) {
    document.querySelectorAll('.format-btn.active').forEach(b => b.classList.remove('active'));
    if (activeBtn) activeBtn.classList.add('active');

    const proxyUrl = `${BACKEND}/api/stream?url=${encodeURIComponent(url)}`;

    if (plyrPlayer) {
      plyrPlayer.source = {
        type: 'video',
        sources: [{ src: proxyUrl, type: 'video/mp4' }]
      };
    } else {
      document.getElementById('player').src = proxyUrl;
    }
  }

  async function fetchVideo() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) return;

    hideError();
    document.getElementById('result').style.display = 'none';

    const btn = document.getElementById('fetchBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Analyzing…';

    try {
      const res = await fetch(`${BACKEND}/api/info`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Server error ${res.status}`);
      }

      const data = await res.json();
      renderResult(data);

    } catch (e) {
      showError(e.message || 'Failed to fetch. Is the backend running?');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Analyze';
    }
  }

  function renderResult(data) {
    document.getElementById('thumb').src           = data.thumbnail || '';
    document.getElementById('title').textContent   = data.title || 'Unknown title';
    document.getElementById('uploader').textContent = data.uploader || '';
    document.getElementById('duration').textContent = formatDuration(data.duration);

    const allFormats = data.formats || [];

    // Video: mp4 with actual video stream
    const videoFmts = allFormats
      .filter(f => f.ext === 'mp4' && f.vcodec && f.vcodec !== 'none')
      .sort((a, b) => (b.filesize || 0) - (a.filesize || 0));

    // If no mp4, fall back to any format with video
    const fallbackFmts = allFormats
      .filter(f => f.vcodec && f.vcodec !== 'none')
      .sort((a, b) => (b.filesize || 0) - (a.filesize || 0));

    const finalVideoFmts = videoFmts.length ? videoFmts : fallbackFmts;

    // Audio only
    const audioFmts = allFormats
      .filter(f => (!f.vcodec || f.vcodec === 'none'))
      .slice(0, 5);

    // Render video buttons
    const vContainer = document.getElementById('videoFormats');
    vContainer.innerHTML = '';
    finalVideoFmts.forEach((f, i) => {
      const btn = document.createElement('button');
      btn.className = 'format-btn' + (i === 0 ? ' active' : '');

      const dlUrl = `${BACKEND}/api/stream?url=${encodeURIComponent(f.url)}`;

      btn.innerHTML = `
        <span>${f.resolution || f.ext || 'video'} ${f.fps ? f.fps + 'fps' : ''}</span>
        <span class="format-right">
          <span class="format-size">${formatSize(f.filesize)}</span>
          <a href="${dlUrl}" download="video.mp4" target="_blank" rel="noreferrer"
             class="format-badge"
             onclick="event.stopPropagation()">↓ DL</a>
        </span>
      `;
      btn.onclick = () => setStream(f.url, btn);
      vContainer.appendChild(btn);
    });

    if (!finalVideoFmts.length) {
      vContainer.innerHTML = '<p style="color:var(--muted);font-size:.85rem">No video formats found</p>';
    }

    // Render audio buttons
    const aContainer = document.getElementById('audioFormats');
    aContainer.innerHTML = '';
    audioFmts.forEach(f => {
      const dlUrl = `${BACKEND}/api/stream?url=${encodeURIComponent(f.url)}`;
      const a = document.createElement('a');
      a.className = 'format-btn';
      a.href = dlUrl;
      a.download = `audio.${f.ext}`;
      a.target = '_blank';
      a.rel = 'noreferrer';
      a.innerHTML = `
        <span>${f.ext ? f.ext.toUpperCase() : 'Audio'} · ${f.acodec || 'audio'}</span>
        <span class="format-badge">↓ DL</span>
      `;
      aContainer.appendChild(a);
    });

    if (!audioFmts.length) {
      aContainer.innerHTML = '<p style="color:var(--muted);font-size:.85rem">No audio formats found</p>';
    }

    // Show result
    document.getElementById('result').style.display = 'block';

    // Init Plyr
    const video = document.getElementById('player');
    if (plyrPlayer) { plyrPlayer.destroy(); plyrPlayer = null; }

    const bestVideo = finalVideoFmts[0];
    if (bestVideo) {
      video.src = `${BACKEND}/api/stream?url=${encodeURIComponent(bestVideo.url)}`;
      plyrPlayer = new Plyr(video, {
        controls: ['play','progress','current-time','mute','volume','fullscreen','settings'],
        settings: ['speed'],
        speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
      });
    }

    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
</script>
</body>
</html>
