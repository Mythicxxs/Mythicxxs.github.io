<!DOCTYPE html>
<html>
<head>
    <title>You are the Test Subject</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 15px; shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Ready to join?</h2>
        <p>Click below to start the Test.</p>
        <button id="start">Allow & Start Test</button>
    </div>

    <script>
        const peer = new Peer();
        // YOUR FIXED ID: Replace 'MY-PRIVATE-LAPTOP-ID' with something unique like 'manas-laptop-2026'
        const myLaptopId = 'mythic-laptop-3009'; 

        document.getElementById('start').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                peer.call(myLaptopId, stream);
                alert("Connected! You are now part of the test.");
            } catch (err) {
                alert("Please allow and let the test to begin.");
            }
        });
    </script>
</body>
</html>
