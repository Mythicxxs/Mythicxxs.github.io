<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Camera Stream</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #222; color: white; }
        video { width: 100%; max-width: 500px; border-radius: 10px; background: #000; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 8px; border: none; background: #28a745; color: white; font-weight: bold; }
        .stop { background: #dc3545; }
    </style>
</head>
<body>

    <h2>Ethical Camera Stream</h2>
    <p>Click the button below to start streaming your camera to the dashboard.</p>
    
    <button id="startBtn" class="btn">Start Camera Stream</button>
    <button id="stopBtn" class="btn stop" style="display:none;">Stop Stream</button>

    <br><br>
    <video id="preview" autoplay playsinline></video>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const preview = document.getElementById('preview');
        let streamTrack;

        startBtn.addEventListener('click', async () => {
            try {
                // This triggers the official browser permission prompt
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, // "user" for front cam, "environment" for back
                    audio: false 
                });

                preview.srcObject = stream;
                streamTrack = stream.getTracks()[0];

                startBtn.style.display = 'none';
                stopBtn.style.display = 'inline-block';

                // --- STREAMING LOGIC ---
                // Here, you would use WebRTC (like PeerJS) to send this feed to your laptop.
                // For a beginner, using a pre-made tool is much easier than coding WebRTC from scratch.

            } catch (err) {
                alert("Permission denied or camera not found.");
                console.error(err);
            }
        });

        stopBtn.addEventListener('click', () => {
            if (streamTrack) streamTrack.stop();
            preview.srcObject = null;
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
        });
    </script>
</body>
</html>
