<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Monitor</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; margin: 0; padding: 10px; }
        video { width: 100%; max-width: 800px; border: 2px solid #333; border-radius: 10px; background: #111; margin-top: 10px; }
        #log { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <h3>[ MASTER MONITOR ]</h3>
    <div id="status">WAITING FOR CONNECTION...</div>
    <video id="display" autoplay playsinline></video>
    <div id="log">Logs: <span id="log-text">Initializing...</span></div>

    <script>
        const MASTER_ID = 'mythic-laptop-3009'; // MUST MATCH join.html

        const peer = new Peer(MASTER_ID, {
            config: { 'iceServers': [
                { url: 'stun:stun.l.google.com:19302' },
                { url: 'stun:stun1.l.google.com:19302' }
            ]}
        });

        const logText = document.getElementById('log-text');
        const status = document.getElementById('status');

        peer.on('open', (id) => { logText.innerText = "Online. ID: " + id; });

        peer.on('call', (call) => {
            logText.innerText = "Incoming call detected...";
            call.answer(); 
            call.on('stream', (stream) => {
                status.innerText = "!!! LIVE FEED ACTIVE !!!";
                status.style.color = "red";
                document.getElementById('display').srcObject = stream;
            });
        });

        peer.on('error', (err) => { logText.innerText = "Peer Error: " + err.type; });
    </script>
</body>
</html>
